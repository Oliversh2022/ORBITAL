packages:
  - "apps/**"
  - "!apps/backend/.medusa/**"

# pnpm 11+
allowBuilds:
  "@medusajs/telemetry": true
  "@swc/core": true
  esbuild: true
  msgpackr-extract: true
  protobufjs: true

overrides:
  "@types/react": 19.0.5
  "@types/react-dom": 19.0.5
  tsconfig-paths: ^4.2.0

# pnpm 10.x
onlyBuiltDependencies:
  - "@medusajs/telemetry"
