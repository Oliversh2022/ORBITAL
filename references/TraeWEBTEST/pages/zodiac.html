    <style>.orbital-fibers-frame{position:fixed;z-index:0;inset:0;width:100%;height:100%;border:0;pointer-events:none}body{background:transparent!important}body>main{position:relative;z-index:1;background:transparent}</style>

    <main>
        <style>
            @keyframes wheel-spin {
                from { transform: rotate(0deg); }
                to { transform: rotate(360deg); }
            }
            @keyframes wheel-fade-in {
                from { opacity: 0; transform: translateY(12px) scale(0.98); }
                to { opacity: 1; transform: translateY(0) scale(1); }
            }
            @media (prefers-reduced-motion: reduce) {
                .wheel-spin-slow,
                .wheel-reveal {
                    animation: none !important;
                }
            }
            .wheel-spin-slow {
                animation: wheel-spin 120s linear infinite;
                transform-origin: center;
            }
            .wheel-reveal {
                animation: wheel-fade-in 0.6s ease-out forwards;
            }
            .zodiac-input {
                background: color-mix(in srgb, var(--orbital-input) 60%, transparent);
                border: 1px solid var(--orbital-border);
                color: var(--orbital-foreground);
            }
            .zodiac-input:focus {
                outline: none;
                border-color: var(--orbital-primary);
                box-shadow: 0 0 0 2px color-mix(in srgb, var(--orbital-primary) 20%, transparent);
            }
            .zodiac-input option {
                background: var(--orbital-card);
                color: var(--orbital-foreground);
            }
            .reveal {
                opacity: 0;
                transform: translateY(1.5rem);
                transition: opacity 0.7s cubic-bezier(0.22, 1, 0.36, 1), transform 0.7s cubic-bezier(0.22, 1, 0.36, 1);
                transition-delay: calc(var(--reveal-index, 0) * 80ms);
            }
            .reveal.visible {
                opacity: 1;
                transform: translateY(0);
            }
            .reveal-static {
                opacity: 0;
                transform: translateY(1.5rem);
                animation: reveal-in 0.8s cubic-bezier(0.22, 1, 0.36, 1) forwards;
                animation-delay: calc(var(--reveal-index, 0) * 80ms + 0.3s);
            }
            @keyframes reveal-in {
                to { opacity: 1; transform: translateY(0); }
            }
            .hero-reveal {
                opacity: 0;
                transform: translateY(1.5rem);
                animation: hero-in 0.9s cubic-bezier(0.22, 1, 0.36, 1) forwards;
                animation-delay: var(--hero-delay, 0.1s);
            }
            @keyframes hero-in {
                to { opacity: 1; transform: translateY(0); }
            }
            .planet-marker {
                opacity: 0;
                transform: scale(0);
                transition: opacity 0.6s ease-out, transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
                transform-origin: center;
            }
            .planet-marker.placed {
                opacity: 1;
                transform: scale(1);
            }
            .wheel-pulse {
                animation: wheel-pulse 0.9s ease-out;
            }
            @keyframes wheel-pulse {
                0% { transform: scale(0.96); opacity: 0.6; }
                50% { transform: scale(1.02); opacity: 1; }
                100% { transform: scale(1); opacity: 1; }
            }
            @media (prefers-reduced-motion: reduce) {
                .reveal, .reveal-static, .hero-reveal, .planet-marker {
                    opacity: 1;
                    transform: none;
                    transition: none;
                    animation: none;
                }
                .wheel-pulse {
                    animation: none;
                }
            }

        <script type="module">
            import { SwissEphemeris, Planet, HouseSystem } from 'https://cdn.jsdelivr.net/npm/@swisseph/browser@1.3.1/+esm';

            const zodiacSigns = [
                { name: '白羊', symbol: '♈' }, { name: '金牛', symbol: '♉' },
                { name: '双子', symbol: '♊' }, { name: '巨蟹', symbol: '♋' },
                { name: '狮子', symbol: '♌' }, { name: '处女', symbol: '♍' },
                { name: '天秤', symbol: '♎' }, { name: '天蝎', symbol: '♏' },
                { name: '射手', symbol: '♐' }, { name: '摩羯', symbol: '♑' },
                { name: '水瓶', symbol: '♒' }, { name: '双鱼', symbol: '♓' }
            ];

            const cityData = {
                '北京': { lat: 39.9042, lon: 116.4074 },
                '上海': { lat: 31.2304, lon: 121.4737 },
                '广州': { lat: 23.1291, lon: 113.2644 },
                '深圳': { lat: 22.5431, lon: 114.0579 },
                '成都': { lat: 30.5728, lon: 104.0668 },
                '杭州': { lat: 30.2741, lon: 120.1551 },
                '武汉': { lat: 30.5928, lon: 114.3055 },
                '西安': { lat: 34.3416, lon: 108.9398 },
                '南京': { lat: 32.0603, lon: 118.7969 },
                '重庆': { lat: 29.5628, lon: 106.5528 },
                '其他': { lat: 39.9042, lon: 116.4074 }
            };

            const swe = new SwissEphemeris();
            let sweReady = false;

            async function ensureSwe() {
                if (!sweReady) {
                    await swe.init();
                    sweReady = true;
                }
            }

            function signName(longitude) {
                return zodiacSigns[Math.floor(longitude / 30) % 12].name;
            }

            const glyphFamily = 'Segoe UI Symbol, Noto Sans Symbols 2, sans-serif';
            const planetGlyphs = {
                sun: '☉', moon: '☽', mercury: '☿', venus: '♀', mars: '♂',
                jupiter: '♃', saturn: '♄', uranus: '♅', neptune: '♆', pluto: '♇'
            };

            function degMin(longitude) {
                const deg = Math.floor(longitude % 30);
                const min = Math.floor(((longitude % 30) - deg) * 60);
                return `${deg}°${min < 10 ? '0' + min : min}′`;
            }

            function renderSignLabels() {
                const group = document.getElementById('sign-ring');
                if (!group) return;
                let html = '';
                zodiacSigns.forEach((sign, i) => {
                    const boundary = (i * 30 - 90) * Math.PI / 180;
                    const bx1 = 200 + 165 * Math.cos(boundary);
                    const by1 = 200 + 165 * Math.sin(boundary);
                    const bx2 = 200 + 190 * Math.cos(boundary);
                    const by2 = 200 + 190 * Math.sin(boundary);
                    html += `<line x1="${bx1}" y1="${by1}" x2="${bx2}" y2="${by2}" stroke="rgba(255,255,255,0.1)" stroke-width="1" />`;

                    const mid = i * 30 + 15 - 90;
                    const rad = mid * Math.PI / 180;
                    const x = 200 + 177 * Math.cos(rad);
                    const y = 200 + 177 * Math.sin(rad);
                    html += `<text x="${x}" y="${y - 2}" text-anchor="middle" fill="var(--orbital-foreground)" font-size="16" font-family="${glyphFamily}">${sign.symbol}</text>`;
                    html += `<text x="${x}" y="${y + 11}" text-anchor="middle" fill="var(--orbital-muted-foreground)" font-size="8" font-family="var(--orbital-font-sans)" style="letter-spacing:0.04em;">${sign.name}</text>`;
                });
                group.innerHTML = html;
            }

            function updateHouseLines(cusps) {
                const group = document.getElementById('house-lines');
                if (!group) return;
                let html = '';
                for (let i = 1; i <= 12; i++) {
                    const lon = cusps[i];
                    const rad = (lon - 90) * Math.PI / 180;
                    const x1 = 200 + 190 * Math.cos(rad);
                    const y1 = 200 + 190 * Math.sin(rad);
                    html += `<line x1="${x1}" y1="${y1}" x2="200" y2="200" />`;
                }
                group.innerHTML = html;
            }

            function updateCuspDegrees(cusps) {
                const group = document.getElementById('cusp-degrees');
                if (!group) return;
                let html = '';
                for (let i = 1; i <= 12; i++) {
                    const lon = cusps[i];
                    const rad = (lon - 90) * Math.PI / 180;
                    const x = 200 + 182 * Math.cos(rad);
                    const y = 200 + 182 * Math.sin(rad);
                    html += `<text x="${x}" y="${y + 2}" text-anchor="middle" fill="var(--orbital-muted-foreground)" font-size="7" font-family="var(--orbital-font-sans)">${degMin(lon)}</text>`;
                }
                group.innerHTML = html;
            }

            function updateHouseNumbers(cusps) {
                const group = document.getElementById('house-numbers');
                if (!group) return;
                let html = '';
                for (let i = 1; i <= 12; i++) {
                    const c1 = cusps[i];
                    const c2 = cusps[i < 12 ? i + 1 : 1];
                    const span = (c2 - c1 + 360) % 360;
                    const mid = c1 + span / 2;
                    const rad = (mid - 90) * Math.PI / 180;
                    const x = 200 + 140 * Math.cos(rad);
                    const y = 200 + 140 * Math.sin(rad);
                    html += `<text x="${x}" y="${y + 3}" text-anchor="middle" fill="var(--orbital-primary)" font-size="10" font-family="var(--orbital-font-sans)" style="font-weight:600;opacity:0.85;">${i}</text>`;
                }
                group.innerHTML = html;
            }

            function updateAxisLines(cusps) {
                const group = document.getElementById('axis-lines');
                if (!group) return;
                const axes = [
                    { from: cusps[1], label: 'ASC', color: '#4ade80' },
                    { from: cusps[7], label: 'DSC', color: '#f87171' },
                    { from: cusps[10], label: 'MC', color: '#c9a962' },
                    { from: cusps[4], label: 'IC', color: '#8b7bc9' }
                ];
                let html = '';
                axes.forEach(a => {
                    const rad = (a.from - 90) * Math.PI / 180;
                    const x1 = 200 + 190 * Math.cos(rad);
                    const y1 = 200 + 190 * Math.sin(rad);
                    const x2 = 200 - 190 * Math.cos(rad);
                    const y2 = 200 - 190 * Math.sin(rad);
                    html += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${a.color}" stroke-opacity="0.7" />`;
                    const lx = 200 + 178 * Math.cos(rad);
                    const ly = 200 + 178 * Math.sin(rad);
                    html += `<circle cx="${lx}" cy="${ly}" r="9" fill="var(--orbital-card)" stroke="${a.color}" stroke-width="1" opacity="0.95" />`;
                    html += `<text x="${lx}" y="${ly + 3}" text-anchor="middle" fill="${a.color}" font-size="7" font-family="var(--orbital-font-sans)" style="font-weight:700;">${a.label}</text>`;
                });
                group.innerHTML = html;
            }

            function calculateAspects(bodies) {
                const aspects = [];
                // 测测相位颜色：六分=蓝，四分=红，三分=绿，对分=紫
                const defs = [
                    { value: 60, orb: 6, color: '#60a5fa' },
                    { value: 90, orb: 7, color: '#f87171' },
                    { value: 120, orb: 7, color: '#4ade80' },
                    { value: 180, orb: 8, color: '#a78bfa' }
                ];
                for (let i = 0; i < bodies.length; i++) {
                    for (let j = i + 1; j < bodies.length; j++) {
                        let diff = Math.abs(bodies[i].longitude - bodies[j].longitude);
                        if (diff > 180) diff = 360 - diff;
                        for (const a of defs) {
                            if (Math.abs(diff - a.value) <= a.orb) {
                                aspects.push({ a: bodies[i], b: bodies[j], color: a.color });
                                break;
                            }
                        }
                    }
                }
                return aspects;
            }

            function updateAspectLines(aspects) {
                const group = document.getElementById('aspect-lines');
                if (!group) return;
                let html = '';
                aspects.forEach(as => {
                    const r = 92;
                    const radA = (as.a.longitude - 90) * Math.PI / 180;
                    const radB = (as.b.longitude - 90) * Math.PI / 180;
                    const x1 = 200 + r * Math.cos(radA);
                    const y1 = 200 + r * Math.sin(radA);
                    const x2 = 200 + r * Math.cos(radB);
                    const y2 = 200 + r * Math.sin(radB);
                    html += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${as.color}" stroke-opacity="0.8" stroke-width="1.1" stroke-linecap="round" />`;
                });
                group.innerHTML = html;
            }

            function updatePlanetMarkers(bodies) {
                const group = document.getElementById('planet-markers');
                if (!group) return;
                let html = '';
                bodies.forEach(b => {
                    const rad = (b.longitude - 90) * Math.PI / 180;
                    const x = 200 + b.radius * Math.cos(rad);
                    const y = 200 + b.radius * Math.sin(rad);
                    html += `<g class="planet-marker placed" transform="translate(${x},${y})">`;
                    html += `<circle r="8" fill="var(--orbital-card)" stroke="${b.color}" stroke-width="1.5" />`;
                    html += `<text x="0" y="4" text-anchor="middle" fill="${b.color}" font-size="12" font-family="${glyphFamily}">${b.glyph}</text>`;
                    html += `<text x="11" y="4" text-anchor="start" fill="${b.color}" font-size="7" font-family="var(--orbital-font-sans)">${degMin(b.longitude)}</text>`;
                    html += `</g>`;
                });
                group.innerHTML = html;
            }

            function revealResult() {
                const inner = document.getElementById('result-inner');
                inner.classList.add('visible');
                inner.querySelectorAll('.reveal').forEach((child, i) => {
                    setTimeout(() => child.classList.add('visible'), i * 80);
                });
            }

            function setLoading(loading) {
                const btn = document.getElementById('submit-btn');
                const text = document.getElementById('btn-text');
                const spinner = document.getElementById('btn-spinner');
                btn.disabled = loading;
                text.textContent = loading ? '星历计算中…' : '生成命盘';
                spinner.classList.toggle('hidden', !loading);
            }

            function toUTCDate(dateStr, timeStr, dst) {
                const [y, m, d] = dateStr.split('-').map(Number);
                const [hh, mm] = timeStr.split(':').map(Number);
                const offsetHours = 8 + (dst ? 1 : 0);
                return new Date(Date.UTC(y, m - 1, d, hh - offsetHours, mm, 0));
            }

            renderSignLabels();

            const form = document.getElementById('zodiac-form');
            const result = document.getElementById('result');
            const wheelContainer = document.getElementById('wheel-container');
            const planetListGrid = document.getElementById('planet-list-grid');

            const bodies = [
                { id: 'sun', planet: Planet.Sun, label: '太阳', glyph: planetGlyphs.sun, radius: 100, color: '#c9a962' },
                { id: 'moon', planet: Planet.Moon, label: '月亮', glyph: planetGlyphs.moon, radius: 122, color: '#8b7bc9' },
                { id: 'mercury', planet: Planet.Mercury, label: '水星', glyph: planetGlyphs.mercury, radius: 70, color: '#4ade80' },
                { id: 'venus', planet: Planet.Venus, label: '金星', glyph: planetGlyphs.venus, radius: 140, color: '#f6f6f7' },
                { id: 'mars', planet: Planet.Mars, label: '火星', glyph: planetGlyphs.mars, radius: 86, color: '#f87171' },
                { id: 'jupiter', planet: Planet.Jupiter, label: '木星', glyph: planetGlyphs.jupiter, radius: 154, color: '#facc15' },
                { id: 'saturn', planet: Planet.Saturn, label: '土星', glyph: planetGlyphs.saturn, radius: 58, color: '#8a8a98' },
                { id: 'uranus', planet: Planet.Uranus, label: '天王星', glyph: planetGlyphs.uranus, radius: 112, color: '#60a5fa' },
                { id: 'neptune', planet: Planet.Neptune, label: '海王星', glyph: planetGlyphs.neptune, radius: 132, color: '#38bdf8' },
                { id: 'pluto', planet: Planet.Pluto, label: '冥王星', glyph: planetGlyphs.pluto, radius: 76, color: '#a78bfa' }
            ];

            form.addEventListener('submit', async function(e) {
                e.preventDefault();
                setLoading(true);
                try {
                    await ensureSwe();

                    const date = document.getElementById('birth-date').value;
                    const time = document.getElementById('birth-time').value;
                    const city = document.getElementById('birth-city').value;
                    const dst = document.getElementById('dst').checked;
                    const coords = cityData[city] || cityData['其他'];

                    const utcDate = toUTCDate(date, time, dst);
                    const jd = swe.dateToJulianDay(utcDate);

                    const houses = swe.calculateHouses(jd, coords.lat, coords.lon, HouseSystem.Placidus);
                    updateHouseLines(houses.cusps);
                    updateCuspDegrees(houses.cusps);
                    updateHouseNumbers(houses.cusps);
                    updateAxisLines(houses.cusps);

                    const computed = bodies.map(b => {
                        const pos = swe.calculatePosition(jd, b.planet);
                        return { ...b, longitude: pos.longitude };
                    });

                    const ascendant = houses.ascendant;

                    document.getElementById('sun-result').textContent = signName(computed.find(b => b.id === 'sun').longitude) + '座';
                    document.getElementById('moon-result').textContent = signName(computed.find(b => b.id === 'moon').longitude) + '座';
                    document.getElementById('asc-result').textContent = signName(ascendant) + '座';

                    wheelContainer.classList.remove('wheel-pulse');

                    updatePlanetMarkers(computed);
                    updateAspectLines(calculateAspects(computed));

                    // Planet list
                    planetListGrid.innerHTML = computed.map(b => {
                        const s = zodiacSigns[Math.floor(b.longitude / 30) % 12];
                        return `<div class="rounded-lg border border-border bg-secondary/40 p-3"><div class="flex items-center gap-2 text-xs text-muted-foreground mb-1"><span class="w-2 h-2 rounded-full" style="background:${b.color}"></span>${b.label}</div><div class="text-foreground font-medium">${s.name}<span class="text-muted-foreground text-xs ml-1">${s.symbol} ${degMin(b.longitude)}</span></div></div>`;
                    }).join('');

                    result.classList.remove('hidden');
                    result.scrollIntoView({ behavior: 'smooth', block: 'start' });

                    requestAnimationFrame(() => {
                        revealResult();
                        wheelContainer.classList.add('wheel-pulse');
                    });
                } catch (err) {
                    console.error(err);
                    alert('星历计算失败，请检查网络或时间设置后重试。');
                } finally {
                    setLoading(false);
                }
            });
        </script>
    </main>
    <script src="../assets/JellyRadio.js"></script>
</body>
</html>
