            { num: 12, roman: "XII", cn: "倒吊人", en: "The Hanged Man", keywords: ["牺牲", "换个角度", "等待"], meaning: "暂停与牺牲带来全新的视角。放下执着，等待转机自然浮现。", symbol: `<line x1="0" y1="-40" x2="0" y2="10" stroke="var(--orbital-primary)" stroke-width="2"/><circle cy="20" r="8" fill="var(--orbital-accent)" opacity="0.5"/><path d="M0 28 L0 50 M-12 38 L12 38" stroke="var(--orbital-foreground)" stroke-width="2"/>` },
            { num: 13, roman: "XIII", cn: "死神", en: "Death", keywords: ["结束", "转化", "重生"], meaning: "一个阶段正在结束，转化与重生的能量在涌动。放下旧有，迎接新生。", symbol: `<path d="M-20 -30 L20 30" stroke="var(--orbital-primary)" stroke-width="3"/><path d="M20 -30 L-5 -5" stroke="var(--orbital-accent)" stroke-width="2"/><circle r="10" fill="none" stroke="var(--orbital-foreground)" stroke-width="2" opacity="0.6"/>` },
            { num: 14, roman: "XIV", cn: "节制", en: "Temperance", keywords: ["平衡", "调和", "耐心"], meaning: "平衡与调和是关键。以耐心整合对立面，找到流动中的和谐。", symbol: `<path d="M-15 -20 L15 20" stroke="var(--orbital-primary)" stroke-width="2"/><path d="M-20 10 L-10 25 L-25 25 Z" fill="var(--orbital-accent)" opacity="0.4"/><path d="M20 -10 L10 -25 L25 -25 Z" fill="var(--orbital-accent)" opacity="0.4"/>` },
            { num: 15, roman: "XV", cn: "恶魔", en: "The Devil", keywords: ["束缚", "欲望", "物质"], meaning: "看清束缚你的欲望与执念。觉察即是自由的开端，选择打破枷锁。", symbol: `<path d="M-20 -25 L-10 0 L10 0 L20 -25" fill="none" stroke="var(--orbital-primary)" stroke-width="2"/><circle r="10" fill="var(--orbital-accent)" opacity="0.3"/><path d="M-15 15 Q0 35 15 15" fill="none" stroke="var(--orbital-foreground)" stroke-width="2" opacity="0.5"/>` },
            { num: 16, roman: "XVI", cn: "高塔", en: "The Tower", keywords: ["突变", "觉醒", "打破旧有"], meaning: "突如其来的变化打破旧有结构。虽然剧烈，却为真实的觉醒腾出空间。", symbol: `<path d="M-20 40 L-15 -20 L15 -20 L20 40 Z" fill="var(--orbital-primary)" opacity="0.2"/><path d="M-5 -20 L5 -40 L15 -25 L5 -25 L5 -15" fill="none" stroke="var(--orbital-accent)" stroke-width="2"/>` },
            { num: 17, roman: "XVII", cn: "星星", en: "The Star", keywords: ["希望", "灵感", "宁静"], meaning: "希望与灵感正在回归。保持信心，宁静中将孕育新的可能性。", symbol: `<path d="M-15 -10 L0 10 L15 -10" fill="none" stroke="var(--orbital-primary)" stroke-width="2"/><circle cx="-20" cy="-25" r="4" fill="var(--orbital-primary)"/><circle cx="20" cy="-25" r="3" fill="var(--orbital-accent)"/><circle cy="-35" r="5" fill="var(--orbital-primary)" opacity="0.5"/>` },
            { num: 18, roman: "XVIII", cn: "月亮", en: "The Moon", keywords: ["幻象", "潜意识", "不安"], meaning: "幻象与不安浮现，潜意识在向你传递讯息。穿越迷雾，相信直觉的指引。", symbol: `<path d="M-15 -20 A20 20 0 1 1 -15 20 A15 15 0 1 0 -15 -20" fill="var(--orbital-accent)" opacity="0.3"/><circle cx="-25" cy="25" r="5" fill="var(--orbital-primary)" opacity="0.5"/><circle cx="25" cy="25" r="5" fill="var(--orbital-foreground)" opacity="0.3"/>` },

            { num: 21, roman: "XXI", cn: "世界", en: "The World", keywords: ["完成", "圆满", "成就"], meaning: "一个完整的周期即将圆满达成。庆祝成就，同时也准备迎接新的循环。", symbol: `<circle r="35" fill="none" stroke="var(--orbital-primary)" stroke-width="2" stroke-dasharray="2 4"/><circle r="8" fill="var(--orbital-accent)" opacity="0.4"/><path d="M-8 15 Q0 30 8 15 Q0 0 -8 15" fill="var(--orbital-primary)" opacity="0.3"/>` }
        ];

        const gridEl = document.getElementById('grid');
        const resultPanel = document.getElementById('result-panel');
        const resultVisual = document.getElementById('result-card-visual');
        const resultRoman = document.getElementById('result-roman');
        const resultTitle = document.getElementById('result-title');
        const resultKeywords = document.getElementById('result-keywords');
        const resultMeaning = document.getElementById('result-meaning');
        let selectedIndex = null;
        let isShuffling = false;
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let audioEnabled = false;

        async function ensureAudio() {
            if (!audioEnabled && audioCtx && audioCtx.state === 'suspended') {
                await audioCtx.resume();
                audioEnabled = true;
            }
        }

        function createNoiseBuffer(duration) {
            const sampleRate = audioCtx.sampleRate;
            const frames = Math.floor(sampleRate * duration);
            const buffer = audioCtx.createBuffer(1, frames, sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < frames; i++) {
                data[i] = Math.random() * 2 - 1;
            }
            return buffer;
        }

        function playNoise(duration, volume = 0.06) {
            if (!audioCtx) return;
            const src = audioCtx.createBufferSource();
            src.buffer = createNoiseBuffer(duration);
            const gain = audioCtx.createGain();
            const now = audioCtx.currentTime;
            gain.gain.setValueAtTime(0, now);
            gain.gain.linearRampToValueAtTime(volume, now + 0.04);
            gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
            src.connect(gain).connect(audioCtx.destination);
            src.start();
        }

        function playShuffleSound() {
            playNoise(0.35, 0.05);
            setTimeout(() => playNoise(0.35, 0.05), 280);
        }

        function playFlipSound() {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            const now = audioCtx.currentTime;
            osc.frequency.setValueAtTime(260, now);
            osc.frequency.exponentialRampToValueAtTime(720, now + 0.14);
            gain.gain.setValueAtTime(0, now);
            gain.gain.linearRampToValueAtTime(0.05, now + 0.02);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
            osc.connect(gain).connect(audioCtx.destination);
            osc.start();
            osc.stop(now + 0.2);
        }

        function playDealSound() {
            if (!audioCtx) return;
            const now = audioCtx.currentTime;
            [440, 554, 659].forEach((freq, i) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.value = freq;
                gain.gain.setValueAtTime(0, now + i * 0.05);
                gain.gain.linearRampToValueAtTime(0.025, now + i * 0.05 + 0.03);
                gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.05 + 0.35);
                osc.connect(gain).connect(audioCtx.destination);
                osc.start(now + i * 0.05);
                osc.stop(now + i * 0.05 + 0.4);
            });
        }

        function renderGrid(opts = {}) {
            const { entering = false, shuffling = false } = opts;
            const totalAngle = 90;
            const step = totalAngle / (cards.length - 1);
            const start = -totalAngle / 2;
            gridEl.innerHTML = cards.map((card, index) => {
                const angle = start + index * step;
                const extraClass = (entering ? ' entering' : '') + (shuffling ? ' shuffling' : '');
                return `
                <button class="fan-card card group perspective text-left${extraClass}" style="--angle:${angle}deg" data-index="${index}" aria-label="塔罗牌 ${card.num} ${card.cn}" role="listitem">
                    <div class="card-inner relative w-full aspect-tarot rounded-xl shadow-md transition-shadow duration-300 group-hover:shadow-lg">
                        <div class="card-back absolute inset-0 rounded-xl overflow-hidden border border-border">${cardBackHtml()}</div>
                        <div class="card-face absolute inset-0 rounded-xl overflow-hidden border border-primary">${cardFaceSvg(card)}</div>
                    </div>
                </button>`;
            }).join('');
        }

        function selectCard(index) {
            if (isShuffling) return;
            ensureAudio();
            const buttons = gridEl.querySelectorAll('.fan-card');
            if (selectedIndex === index) {
                resetSelection();
                return;
            }
            selectedIndex = index;
            buttons.forEach((btn, i) => {
                btn.classList.toggle('flipped', i === index);
                btn.classList.toggle('card-dimmed', i !== index);
                btn.classList.toggle('selected', i === index);
            });
            playFlipSound();
            showResult(cards[index]);
        }

        function resetSelection() {
            selectedIndex = null;
            gridEl.querySelectorAll('.fan-card').forEach(btn => {
                btn.classList.remove('flipped', 'card-dimmed', 'selected');
            });
            resultPanel.classList.add('hidden');
        }

        function showResult(card) {
            resultVisual.innerHTML = cardFaceSvg(card);
            resultRoman.textContent = card.roman;
            resultTitle.textContent = `${card.num}. ${card.cn} ${card.en}`;
            resultKeywords.innerHTML = card.keywords.map(k => `<span class="inline-flex items-center rounded-full border border-border bg-secondary px-3 py-1 text-xs text-secondary-foreground">${k}</span>`).join('');
            resultMeaning.textContent = card.meaning;
            resultPanel.classList.remove('hidden');
            resultPanel.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        function wait(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        async function shuffleDeck() {
            if (isShuffling) return;
            await ensureAudio();
            isShuffling = true;
            gridEl.classList.add('is-shuffling');
            resetSelection();
            playShuffleSound();

            // Gather into deck
            gridEl.querySelectorAll('.fan-card').forEach(btn => btn.classList.add('shuffling'));
            await wait(850);

            // Shuffle array (Fisher-Yates)
            for (let i = cards.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [cards[i], cards[j]] = [cards[j], cards[i]];
            }

            // Re-render in stacked state then fan out
            renderGrid({ shuffling: true });
            gridEl.offsetHeight; // force reflow
            playShuffleSound();
            await wait(120);
            requestAnimationFrame(() => {
                requestAnimationFrame(() => {
                    gridEl.querySelectorAll('.fan-card.shuffling').forEach(btn => btn.classList.remove('shuffling'));
                    gridEl.classList.remove('is-shuffling');
                    isShuffling = false;
                });
            });
        }

        // Initial entrance: render stacked, then fan out
        renderGrid({ entering: true });
        requestAnimationFrame(() => {
            requestAnimationFrame(() => {
                gridEl.querySelectorAll('.fan-card.entering').forEach(btn => btn.classList.remove('entering'));
                ensureAudio().then(() => playDealSound());
            });
        });

        gridEl.addEventListener('click', (e) => {
            if (isShuffling) return;
            const cardBtn = e.target.closest('.card');
            if (!cardBtn) return;
            selectCard(Number(cardBtn.dataset.index));
        });
        document.getElementById('reset-draw').addEventListener('click', () => {
            resetSelection();
            document.getElementById('card-grid').scrollIntoView({ behavior: 'smooth', block: 'start' });
        });
        document.getElementById('shuffle-btn').addEventListener('click', shuffleDeck);
    });
    </script>
