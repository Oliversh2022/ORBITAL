  <iframe class="fibers" data-deferred-src="/ghost-fibers.html" title="ORBITAL 动态背景" aria-hidden="true" tabindex="-1"></iframe>

    <div class="site-shell-header__inner">
      <a href="/" class="site-shell-brand"><span class="site-shell-brand__mark">✦</span><span>ORBITAL</span></a>
      <nav class="site-shell-nav" aria-label="主导航">
        <div class="jelly-radio" data-jelly-radio role="radiogroup" aria-label="主导航">
          <a class="jelly-radio__chip" data-value="home" data-href="/#top" href="/#top" role="radio" aria-checked="false" data-on="false" tabindex="-1"><span class="jelly-radio__skin">首页</span></a>
          <a class="jelly-radio__chip" data-value="featured" data-href="/#products" href="/#products" role="radio" aria-checked="false" data-on="false" tabindex="-1"><span class="jelly-radio__skin">精选</span></a>
          <a class="jelly-radio__chip" data-value="explore" data-href="/#explore" href="/#explore" role="radio" aria-checked="false" data-on="false" tabindex="-1"><span class="jelly-radio__skin">占卜</span></a>
          <a class="jelly-radio__chip" data-value="shop" data-href="/shop.html" href="/shop.html" role="radio" aria-checked="true" data-on="true" tabindex="0"><span class="jelly-radio__skin">寻物</span></a>
        </div>
      </nav>
      <div class="site-shell-actions">
        <div class="site-shell-language"><span>中</span><span class="site-shell-language__slash">/</span><span>EN</span></div>

        <a href="/#explore" class="site-shell-cta">开始占卜</a>

    </div>

  <main class="page">
    <section class="page-hero"><p class="eyebrow">ORBITAL / Preview Catalog</p><h1>精选手串</h1><p>从材质、意图与佩戴感出发，找到一件愿意陪你走得久一点的随身之物。</p></section>

      <div class="filters"><button class="filter" data-filter="all" aria-pressed="true">全部</button><button class="filter" data-filter="守护" aria-pressed="false">守护</button><button class="filter" data-filter="平静" aria-pressed="false">平静</button><button class="filter" data-filter="直觉" aria-pressed="false">直觉</button><label class="filter"><span class="sr-only">搜索</span><input data-search type="search" placeholder="搜索商品 / 材质" aria-label="搜索商品或材质" style="width:140px;border:0;outline:0;background:transparent;color:inherit"></label></div>
      <select class="sort" data-sort aria-label="商品排序"><option value="featured">精选排序</option><option value="price-asc">价格由低到高</option><option value="price-desc">价格由高到低</option></select>
    </section>
    <section class="catalog" data-catalog aria-live="polite"><div class="empty">正在载入商品目录…</div></section>

  <footer class="footer"><div class="page footer-inner"><span>ORBITAL · 以星为引，寻物安心。</span><a href="/#explore">继续探索占卜 →</a></div></footer>
